# Serves the built SPA. Security headers live at server level only: any add_header inside a
# location would silently drop them, so locations use `expires` for caching instead.
server {
    listen 4000;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;                       # don't advertise the nginx version

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # Only this site's own JS runs; data goes only to Supabase (API, signed image/PDF URLs).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.sentry.io; frame-src https://*.supabase.co blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed filenames (index-C7_WQI84.js) never change content, so cache them for a year.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # index.html must always be re-checked, or users keep an old app after a deploy.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
