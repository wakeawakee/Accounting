# Quality gate: runs on every pull request and on main. Vercel deploys main to production,
# so a red CI on a PR is the signal not to merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read            # least privilege: CI can read code, nothing else

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history, so the secret scan sees every commit

      - name: Secret scan (fails the build if a key or password was committed)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tests (rules engine + database schema/RLS)
        run: |
          pnpm --filter @karsathi/shared test
          pnpm --filter @karsathi/supabase-tests test

      - name: Typecheck web
        run: pnpm --filter @karsathi/web typecheck

      - name: Docker image builds (same image homelab staging runs)
        run: >
          docker build -f apps/web/Dockerfile
          --build-arg VITE_SUPABASE_URL=https://ci-placeholder.supabase.co
          --build-arg VITE_SUPABASE_ANON_KEY=ci-placeholder .

      # shortcut: report-only until react-router 7 / i18next upgrades land; then remove continue-on-error.
      - name: Dependency audit (production deps)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
